name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        default: latest
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/admax-india-api:${{ steps.meta.outputs.tag }}

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/admax-india-web:${{ steps.meta.outputs.tag }}

  deploy-k8s:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_K8S_DEPLOY == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region ap-south-1

      - name: Apply manifests
        run: |
          OWNER="${{ github.repository_owner }}"
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          sed -i "s|ghcr.io/EXAMPLE/admax-india-api:.*|ghcr.io/${OWNER}/admax-india-api:${TAG}|g" k8s/*.yaml
          sed -i "s|ghcr.io/EXAMPLE/admax-india-web:.*|ghcr.io/${OWNER}/admax-india-web:${TAG}|g" k8s/*.yaml
          kubectl apply -k k8s/
          kubectl -n admax-india rollout status deployment/admax-api
          kubectl -n admax-india rollout status deployment/admax-web
