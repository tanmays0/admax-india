apiVersion: apps/v1
kind: Deployment
metadata:
  name: admax-api
  namespace: admax-india
  labels:
    app: admax-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: admax-api
  template:
    metadata:
      labels:
        app: admax-api
    spec:
      containers:
        - name: api
          image: ghcr.io/EXAMPLE/admax-india-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: admax-config
            - secretRef:
                name: admax-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: admax-api
  namespace: admax-india
  labels:
    app: admax-api
spec:
  type: ClusterIP
  selector:
    app: admax-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admax-api
  namespace: admax-india
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: admax-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: admax-api
  namespace: admax-india
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: admax-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
