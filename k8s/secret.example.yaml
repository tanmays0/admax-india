type: Opaque
stringData:
  DB_USER: admax
  DB_PASSWORD: change-me
  JWT_SECRET: change-me-to-a-long-random-string
  MYSQL_ROOT_PASSWORD: change-me-root
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
