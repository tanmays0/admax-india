apiVersion: apps/v1
kind: Deployment
metadata:
  name: admax-web
  namespace: admax-india
  labels:
    app: admax-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: admax-web
  template:
    metadata:
      labels:
        app: admax-web
    spec:
      containers:
        - name: web
          image: ghcr.io/EXAMPLE/admax-india-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: API_HOST
              value: admax-api
            - name: API_PORT
              value: "80"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admax-web
  namespace: admax-india
  labels:
    app: admax-web
spec:
  type: ClusterIP
  selector:
    app: admax-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: admax-web
  namespace: admax-india
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: admax-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
