apiVersion: v1
kind: ConfigMap
metadata:
  name: admax-config
  namespace: admax-india
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_HOST: "admax-mysql"
  DB_PORT: "3306"
  DB_NAME: "admax_india"
  JWT_EXPIRES_IN: "7d"
  APP_URL: "https://api.admax.example.com"
  FRONTEND_URL: "https://admax.example.com"
  LOG_LEVEL: "info"
